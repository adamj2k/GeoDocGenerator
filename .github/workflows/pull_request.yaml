name: PullRequest CI

on: 
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  linting:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set Up Python
        uses: actions/setup-python@v6
        with:
          python-version: 3.13
      - name: Install Deps
        run: | 
          python -m pip install --upgrade pip
          pip install ruff
      - name: Run linting
        run: |
          ruff geo_doc_generator/
